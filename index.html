<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230a0a0f'/%3E%3Crect x='2' y='12' width='12' height='1' fill='%2346413a'/%3E%3Crect x='5' y='3' width='4' height='9' fill='%23dcdcc8'/%3E%3Crect x='8' y='3' width='1' height='9' fill='%239a958a'/%3E%3Crect x='11' y='7' width='3' height='5' fill='%237f7a70'/%3E%3Crect x='13' y='7' width='1' height='5' fill='%235f5b53'/%3E%3C/svg%3E" />
    <meta name="description" content="Here Stands What Once Was" />
    <!-- The title run together, lowercase, no spaces. The description carries
         the real one, so search and link previews still say what this is. -->
    <title>herestandswhatoncewas</title>

    <!--
      Critical first-paint styles, inline on purpose.

      `styles.css` is imported from `main.ts`, so Vite serves it *through
      JavaScript* — which means there is a window, before that module has run,
      where the browser paints this document with its own default styles: a
      white page, black text, and the capture hint sitting in the corner. The
      flash is brief and extremely obvious, and nothing inside the app can fix
      it, because the app has not started yet.

      So everything the first frame needs is duplicated here: the dark ground
      colour, and the loading screen itself. The loading markup is static rather
      than built in script for the same reason — it has to exist before any
      script runs. `ui/LoadingScreen.ts` adopts these elements instead of
      creating its own, and `styles.css` restates these rules for the rest of
      the session. The transitions are not here: at `--lit: 0` this is the
      sheet with its frame and an empty bar, which is the frame that wants to
      be up instantly.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #dcdcc8;
        font-family: Optima, Candara, "Gill Sans", "Gill Sans MT", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      /* Scoped to the class so it stops applying the moment boot removes it. An
         unscoped rule here would keep the hint hidden for the whole session. */
      .is-loading #capture-hint {
        opacity: 0;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        overflow: hidden;
        background: #0a0a0f;
        --lit: 0;
        --land: #08080c;
        --tile: 4px;
      }
      .sheet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(88vw, 92vh * 4 / 3);
        aspect-ratio: 4 / 3;
        transform: translate(-50%, -50%);
        background: #15161e;
        isolation: isolate;
      }
      .sheet::before,
      .sheet::after {
        content: '';
        position: absolute;
        z-index: -1;
        image-rendering: pixelated;
        background-size: var(--tile) var(--tile);
      }
      .sheet::before {
        inset: calc(-2 * var(--tile));
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEUlEQVR42mMQFZP7zwADIA4AFFwCkUMSqhYAAAAASUVORK5CYII=");
      }
      .sheet::after {
        inset: calc(-4 * var(--tile));
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAD0lEQVR42mMQFZP7z4AMABKLAUmC8lw9AAAAAElFTkSuQmCC");
      }
      .boot-title {
        position: absolute;
        top: 2.3%;
        left: 0;
        right: 0;
        font-size: 0.82rem;
        letter-spacing: 0.4em;
        text-align: center;
        text-transform: lowercase;
        color: rgb(220 220 200 / 72%);
      }
      .frame {
        position: absolute;
        top: 7.5%;
        left: 6%;
        right: 6%;
        aspect-ratio: 21 / 9;
        border: 1px solid rgb(220 220 200 / 42%);
      }
      .frame::before {
        content: '';
        position: absolute;
        z-index: 1;
        inset: 5px;
        border: 1px solid rgb(220 220 200 / 18%);
        pointer-events: none;
      }
      .frame-corner {
        position: absolute;
        z-index: 2;
        width: 11px;
        height: 11px;
        border: 1px solid rgb(220 220 200 / 60%);
        background:
          linear-gradient(var(--ink), var(--ink)) center / 3px 3px no-repeat,
          #15161e;
      }
      .frame-corner:nth-child(1) {
        top: -6px;
        left: -6px;
      }
      .frame-corner:nth-child(2) {
        top: -6px;
        right: -6px;
      }
      .frame-corner:nth-child(3) {
        bottom: -6px;
        left: -6px;
      }
      .frame-corner:nth-child(4) {
        bottom: -6px;
        right: -6px;
      }
      .picture {
        position: absolute;
        inset: 8px;
        overflow: hidden;
        background: var(--land);
      }

      .scene {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .credit {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(7.5% + 88% * 4 / 3 * 9 / 21 + 0.55rem);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-align: center;
        color: rgb(220 220 200 / 34%);
      }

      .plaque {
        position: absolute;
        left: 50%;
        top: calc((107.5% + 88% * 4 / 3 * 9 / 21) / 2);
        display: grid;
        justify-items: center;
        gap: 0.55rem;
        min-width: 16rem;
        padding: 0.7rem 1.5rem 0.8rem;
        background: var(--void);
        border: 1px solid rgb(220 220 200 / 32%);
        transform: translate(-50%, -50%);
      }
      .loading-place {
        font-size: 1.1rem;
        letter-spacing: 0.18em;
        text-align: center;
        color: rgb(220 220 200 / 90%);
      }
      .loading-label {
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-align: center;
        text-transform: lowercase;
        color: rgb(220 220 200 / 48%);
      }
      .loading-label::after {
        content: '';
        display: inline-block;
        width: var(--tile);
        height: var(--tile);
        margin-left: 0.4em;
        background: rgb(220 220 200 / 48%);
        animation: loading-blink 1s steps(2, jump-none) infinite;
      }
      @keyframes loading-blink {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .bar {
        position: relative;
        width: clamp(9rem, 22vw, 14rem);
        height: 0.45rem;
        background: rgb(220 220 200 / 14%);
        mask-image: repeating-linear-gradient(to right, #000 0 0.3rem, transparent 0.3rem 0.46rem);
      }
      .bar-fill {
        position: absolute;
        inset: 0;
        background: #dcdcc8;
        transform-origin: left center;
        transform: scaleX(var(--lit));
      }
    </style>
  </head>
  <body class="is-loading">
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="crosshair"></div>
      <!--
        The pause stack, shown whenever the mouse is not captured: the controls
        panel, then the buttons the pause screen owns, mounted into
        #pause-buttons by their own modules. The hint is static markup because
        it has to be correct before any module has run.
      -->
      <div id="pause">
        <div id="capture-hint">
        <div class="hint-title">click to play</div>
        <dl class="controls">
          <dt>Look Around</dt>
          <dd>
            <!-- Drawn inline rather than loaded: no asset in this project is a
                 file, and a mouse is four strokes. -->
            <svg class="control-mouse" viewBox="0 0 24 20" aria-label="move the mouse">
              <rect x="8" y="2" width="8" height="16" rx="4" />
              <line x1="12" y1="5.5" x2="12" y2="8.5" />
              <path d="M4.5 6.5 q-1.6 3.5 0 7" />
              <path d="M19.5 6.5 q1.6 3.5 0 7" />
            </svg>
          </dd>

          <dt>Move Around</dt>
          <dd>
            <kbd class="key">W</kbd><kbd class="key">A</kbd><kbd class="key">S</kbd
            ><kbd class="key">D</kbd>
          </dd>

          <dt>Interact</dt>
          <dd><kbd class="key">E</kbd></dd>

          <dt>Sprint</dt>
          <dd><kbd class="key key-wide">Shift</kbd></dd>

          <dt>Crouch</dt>
          <dd><kbd class="key key-wide">Caps Lock</kbd></dd>

          <dt>Jump</dt>
          <dd><kbd class="key key-wide">Space</kbd></dd>
        </dl>
        </div>
        <div id="pause-buttons"></div>
      </div>
    </div>
    <!--
      The loading screen: a painting in a frame on a sheet, hung at random by
      the script under it, which carries the same list `ui/loadingScenes.ts` does.
      Static for the same reason the styles above are — it has to be on screen
      before any module has run. `ui/LoadingScreen.ts` builds the same thing for
      a page that has none, and drives `--lit` for every wait in the game.
    -->
    <div id="loading">
      <div class="sheet">
        <div class="boot-title">here stands what once was</div>
        <div class="frame" aria-hidden="true">
          <div class="frame-corner"></div><div class="frame-corner"></div><div class="frame-corner"></div><div class="frame-corner"></div>
          <div class="picture"><img class="scene" alt="" decoding="async" /></div>
        </div>
        <div class="credit"></div>
        <div class="plaque">
          <div class="loading-place" hidden></div>
          <div class="loading-label">starting</div>
          <div class="bar"><div class="bar-fill"></div></div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const paintings = [
          ['wyant-housatonic-valley', 'Housatonic Valley', 'Alexander Helwig Wyant'],
          ['schaeffer-hungarian-landscape', 'Hungarian Landscape', 'August Schaeffer von Wienwald'],
          ['gay-sound-beach', 'The River, Sound Beach, Connecticut', 'Edward Gay'],
          ['rehn-bass-rocks', 'Beach of Bass Rocks, Gloucester', 'F. K. M. Rehn'],
          ['harpignies-view-of-a-stream', 'View of a Stream', 'Henri Harpignies'],
          ['adams-august-sunset', 'An August Sunset, Prairie Dell', 'J. Ottis Adams'],
          ['constable-willy-lotts-house', "Willy Lott's House", 'John Constable'],
          ['constable-tree-in-a-landscape', 'Tree in a Landscape', 'Lionel Bicknell Constable'],
          ['denis-clouds-over-rome', 'Study of Clouds with a Sunset near Rome', 'Simon Alexandre Clément Denis'],
          ['steele-the-river', 'The River', 'Theodore Clement Steele'],
        ];
        const [id, title, artist] = paintings[Math.floor(Math.random() * paintings.length)];
        const loading = document.getElementById('loading');
        loading.dataset.scene = id;
        loading.querySelector('.scene').src = './paintings/' + id + '.jpg';
        loading.querySelector('.credit').textContent = title + ' \u00b7 ' + artist;
      })();
    </script>
    </div>
    <!-- Isolation, for shared memory. The very first visit reloads once so the
         document is served through the worker with the headers on. -->
    <script>
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('./isolate.js').then((registration) => {
          if (registration.active && !navigator.serviceWorker.controller) location.reload();
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            worker?.addEventListener('statechange', () => {
              if (worker.state === 'activated' && !navigator.serviceWorker.controller) location.reload();
            });
          });
        }, () => {});
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
