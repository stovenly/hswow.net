<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no stops double-tap zoom eating game taps.
         viewport-fit=cover fills the notch area on phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Heaven Sleeps Within Our Wounds" />
    <title>Heaven Sleeps Within Our Wounds</title>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
