<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230a0a0f'/%3E%3Crect x='2' y='12' width='12' height='1' fill='%2346413a'/%3E%3Crect x='5' y='3' width='4' height='9' fill='%23dcdcc8'/%3E%3Crect x='8' y='3' width='1' height='9' fill='%239a958a'/%3E%3Crect x='11' y='7' width='3' height='5' fill='%237f7a70'/%3E%3Crect x='13' y='7' width='1' height='5' fill='%235f5b53'/%3E%3C/svg%3E" />
    <meta name="description" content="Here Stands What Once Was" />
    <!-- The title run together, lowercase, no spaces. The description carries
         the real one, so search and link previews still say what this is. -->
    <title>herestandswhatoncewas</title>

    <!-- First-paint styles: styles.css arrives through main.ts, after this has been drawn. -->
    <script>
      (() => {
        let size = 0;
        try {
          size = JSON.parse(localStorage.getItem('hswow.preset.options') || '{}').fontSize;
        } catch {}
        if (typeof size !== 'number' || !Number.isFinite(size)) size = 0;
        document.documentElement.style.fontSize = 18 + Math.min(Math.max(size, -5), 5) + 'px';
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #dcdcc8;
        font-family: Optima, Candara, "Gill Sans", "Gill Sans MT", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      }
      /* Scoped to the class so it stops applying the moment boot removes it. An
         unscoped rule here would keep the hint hidden for the whole session. */
      .is-loading #capture-hint {
        opacity: 0;
      }
      .is-title #pause {
        display: none;
      }
      #title {
        position: fixed;
        inset: 0;
        z-index: 14;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 3.2rem;
        background: #0a0a0f;
      }
      .title-name {
        font-size: 1.05rem;
        letter-spacing: 0.55em;
        text-transform: lowercase;
        text-align: center;
        color: #dcdcc8;
      }
      .title-buttons {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      .title-button.is-empty {
        visibility: hidden;
      }
      .title-button {
        width: 13rem;
        padding: 0.55rem 1.5rem;
        font: inherit;
        font-size: 0.7rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgb(220 220 200 / 78%);
        background: rgb(10 10 15 / 86%);
        border: 1px solid rgb(220 220 200 / 32%);
        cursor: pointer;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        overflow: hidden;
        background: #0a0a0f;
        --lit: 0;
        --land: #08080c;
        --tile: 4px;
        --bar: 16rem;
      }
      #loading.is-gone {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .sheet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(88vw, 92vh * 4 / 3);
        aspect-ratio: 4 / 3;
        transform: translate(-50%, -50%);
        background: #15161e;
        isolation: isolate;
        --frame-top: 7.5%;
        --frame-height: calc(88% * 4 / 3 * 9 / 16);
      }
      .sheet::before,
      .sheet::after {
        content: '';
        position: absolute;
        z-index: -1;
        image-rendering: pixelated;
        background-size: var(--tile) var(--tile);
      }
      .sheet::before {
        inset: calc(-2 * var(--tile));
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAEUlEQVR42mMQFZP7zwADIA4AFFwCkUMSqhYAAAAASUVORK5CYII=");
      }
      .sheet::after {
        inset: calc(-4 * var(--tile));
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAD0lEQVR42mMQFZP7z4AMABKLAUmC8lw9AAAAAElFTkSuQmCC");
      }
      .boot-title {
        position: absolute;
        top: 2.3%;
        left: 0;
        right: 0;
        font-family: ui-serif, Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", serif;
        font-size: 1.15rem;
        text-align: center;
        color: rgb(220 220 200 / 78%);
      }
      .frame {
        position: absolute;
        top: var(--frame-top);
        left: 6%;
        right: 6%;
        height: var(--frame-height);
        border: 1px solid rgb(220 220 200 / 42%);
      }
      .frame::before {
        content: '';
        position: absolute;
        z-index: 1;
        inset: 5px;
        border: 1px solid rgb(220 220 200 / 18%);
        pointer-events: none;
      }
      .frame-corner {
        position: absolute;
        z-index: 2;
        width: 11px;
        height: 11px;
        border: 1px solid rgb(220 220 200 / 60%);
        background:
          linear-gradient(var(--ink), var(--ink)) center / 3px 3px no-repeat,
          #15161e;
      }
      .frame-corner:nth-child(1) {
        top: -6px;
        left: -6px;
      }
      .frame-corner:nth-child(2) {
        top: -6px;
        right: -6px;
      }
      .frame-corner:nth-child(3) {
        bottom: -6px;
        left: -6px;
      }
      .frame-corner:nth-child(4) {
        bottom: -6px;
        right: -6px;
      }
      .picture {
        position: absolute;
        inset: 8px;
        overflow: hidden;
        background: var(--land);
      }

      .scene {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
      }

      .credit {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--frame-top) + var(--frame-height) + 0.55rem);
        font-family: ui-serif, Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", serif;
        font-size: 0.82rem;
        text-align: center;
        color: rgb(220 220 200 / 50%);
      }

      .credit i {
        font-style: italic;
      }

      .plaque {
        position: absolute;
        left: 50%;
        top: calc((var(--frame-top) + var(--frame-height) + 100%) / 2);
        display: grid;
        justify-items: center;
        gap: 0.7rem;
        transform: translate(-50%, -50%);
      }
      .loading-label {
        font-family: ui-serif, Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", "Times New Roman", serif;
        font-size: 0.82rem;
        text-align: center;
        color: rgb(220 220 200 / 50%);
      }
      @keyframes loading-blink {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .bar {
        position: relative;
        width: var(--bar);
        height: var(--tile);
        overflow: hidden;
        background: rgb(220 220 200 / 14%);
        mask-image: repeating-linear-gradient(to right, #000 0 var(--tile), transparent var(--tile) calc(var(--tile) * 1.5));
      }
      .bar-fill {
        position: absolute;
        inset: 0;
        background: rgb(220 220 200 / 62%);
        transform-origin: left center;
        transform: scaleX(var(--lit));
      }

      .bar-next {
        position: absolute;
        top: 0;
        left: round(up, calc(var(--lit) * var(--bar)), calc(var(--tile) * 1.5));
        width: var(--tile);
        height: 100%;
        background: rgb(220 220 200 / 62%);
        animation: loading-blink 1s steps(2, jump-none) infinite;
      }
    </style>
  </head>
  <body class="is-title">
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="crosshair"></div>
      <div id="pause">
        <div id="capture-hint">
        <div class="hint-title">click to play</div>
        <dl class="controls">
          <dt>Look Around</dt>
          <dd>
            <!-- Drawn inline rather than loaded: no asset in this project is a
                 file, and a mouse is four strokes. -->
            <svg class="control-mouse" viewBox="0 0 24 20" aria-label="move the mouse">
              <rect x="8" y="2" width="8" height="16" rx="4" />
              <line x1="12" y1="5.5" x2="12" y2="8.5" />
              <path d="M4.5 6.5 q-1.6 3.5 0 7" />
              <path d="M19.5 6.5 q1.6 3.5 0 7" />
            </svg>
          </dd>

          <dt>Move Around</dt>
          <dd>
            <kbd class="key">W</kbd><kbd class="key">A</kbd><kbd class="key">S</kbd
            ><kbd class="key">D</kbd>
          </dd>

          <dt>Interact</dt>
          <dd><kbd class="key">E</kbd></dd>

          <dt>Sprint</dt>
          <dd><kbd class="key key-wide">Shift</kbd></dd>

          <dt>Crouch</dt>
          <dd><kbd class="key key-wide">Caps Lock</kbd></dd>

          <dt>Jump</dt>
          <dd><kbd class="key key-wide">Space</kbd></dd>
        </dl>
        </div>
        <div id="pause-buttons"></div>
      </div>
      <div id="title">
        <div class="title-name">here stands what once was</div>
        <div class="title-buttons">
          <button type="button" class="title-button is-empty">continue</button>
          <button type="button" class="title-button">new game</button>
          <button type="button" class="title-button">load</button>
          <button type="button" class="title-button">options</button>
        </div>
      </div>
    </div>
    <!-- The painting list below is also in ui/loadingScenes.ts. -->
    <div id="loading" class="is-gone">
      <div class="sheet">
        <div class="boot-title">here stands what once was</div>
        <div class="frame" aria-hidden="true">
          <div class="frame-corner"></div><div class="frame-corner"></div><div class="frame-corner"></div><div class="frame-corner"></div>
          <div class="picture"><img class="scene" alt="" decoding="async" /></div>
        </div>
        <div class="credit"></div>
        <div class="plaque">
          <div class="loading-label">starting</div>
          <div class="bar"><div class="bar-fill"></div><div class="bar-next"></div></div>
        </div>
      </div>
    </div>
    <script>
      for (let slot = 1; slot <= 3; slot++) {
        if (localStorage.getItem('hswow:save:' + slot)) {
          document.querySelector('.title-button.is-empty').classList.remove('is-empty');
          break;
        }
      }
    </script>
    <script>
      (() => {
        const paintings = [
          ['wyant-housatonic-valley', 'Housatonic Valley', 'Alexander Helwig Wyant'],
          ['schaeffer-hungarian-landscape', 'Hungarian Landscape', 'August Schaeffer von Wienwald'],
          ['gay-sound-beach', 'The River, Sound Beach, Connecticut', 'Edward Gay'],
          ['rehn-bass-rocks', 'Beach of Bass Rocks, Gloucester', 'F. K. M. Rehn'],
          ['harpignies-view-of-a-stream', 'View of a Stream', 'Henri Harpignies'],
          ['adams-august-sunset', 'An August Sunset, Prairie Dell', 'J. Ottis Adams'],
          ['constable-willy-lotts-house', "Willy Lott's House", 'John Constable'],
          ['constable-tree-in-a-landscape', 'Tree in a Landscape', 'Lionel Bicknell Constable'],
          ['denis-clouds-over-rome', 'Study of Clouds with a Sunset near Rome', 'Simon Alexandre Clément Denis'],
          ['steele-the-river', 'The River', 'Theodore Clement Steele'],
        ];
        const [id, title, artist] = paintings[Math.floor(Math.random() * paintings.length)];
        const loading = document.getElementById('loading');
        loading.dataset.scene = id;
        loading.querySelector('.scene').src = './paintings/' + id + '.jpg';
        const credit = loading.querySelector('.credit');
        credit.appendChild(document.createElement('i')).textContent = title;
        credit.append(', ' + artist);
      })();
    </script>
    </div>
    <!-- Isolation, for shared memory. The very first visit reloads once so the
         document is served through the worker with the headers on. -->
    <script>
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator && location.protocol !== 'file:') {
        navigator.serviceWorker.register('./isolate.js').then((registration) => {
          if (registration.active && !navigator.serviceWorker.controller) location.reload();
          registration.addEventListener('updatefound', () => {
            const worker = registration.installing;
            worker?.addEventListener('statechange', () => {
              if (worker.state === 'activated' && !navigator.serviceWorker.controller) location.reload();
            });
          });
        }, () => {});
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
