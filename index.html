<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no stops double-tap zoom eating game taps.
         viewport-fit=cover fills the notch area on phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230a0a0f'/%3E%3Crect x='2' y='12' width='12' height='1' fill='%2346413a'/%3E%3Crect x='5' y='3' width='4' height='9' fill='%23dcdcc8'/%3E%3Crect x='8' y='3' width='1' height='9' fill='%239a958a'/%3E%3Crect x='11' y='7' width='3' height='5' fill='%237f7a70'/%3E%3Crect x='13' y='7' width='1' height='5' fill='%235f5b53'/%3E%3C/svg%3E" />
    <meta name="description" content="Here Stands What Once Was" />
    <!-- The title run together, lowercase, no spaces. The description carries
         the real one, so search and link previews still say what this is. -->
    <title>herestandswhatoncewas</title>

    <!--
      Critical first-paint styles, inline on purpose.

      `styles.css` is imported from `main.ts`, so Vite serves it *through
      JavaScript* — which means there is a window, before that module has run,
      where the browser paints this document with its own default styles: a
      white page, black text, and the capture hint sitting in the corner. The
      flash is brief and extremely obvious, and nothing inside the app can fix
      it, because the app has not started yet.

      So everything the first frame needs is duplicated here: the dark ground
      colour, and the loading screen itself. The loading markup is static rather
      than built in script for the same reason — it has to exist before any
      script runs. `ui/Loader.ts` adopts these elements instead of creating its
      own, and `styles.css` restates these rules for the rest of the session.
      The glimmer's animation is not here: it belongs to the zone indicator,
      which cannot exist this early.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #dcdcc8;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      }
      /* Scoped to the class so it stops applying the moment boot removes it. An
         unscoped rule here would keep the hint hidden for the whole session. */
      .is-loading #capture-hint {
        opacity: 0;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.1rem;
        background: #0a0a0f;
        --raised: 0;
        --stone: #dcdcc8;
        --stone-edge: #9a958a;
        --stone-ghost: rgb(220 220 200 / 8%);
      }
      .raise {
        display: grid;
        justify-items: center;
        gap: 0.5rem;
      }
      .raise-field {
        position: relative;
        display: flex;
        align-items: flex-end;
        gap: 0.55rem;
        overflow: hidden;
      }
      .raise-pile {
        display: flex;
        flex-direction: column-reverse;
        align-items: flex-start;
        width: var(--pw);
      }
      .raise-course {
        position: relative;
        width: var(--w);
        height: 0.6rem;
        margin: 1px 0 0 var(--x);
        background: var(--stone-ghost);
      }
      .raise-course::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--stone);
        box-shadow: inset -0.14rem 0 0 var(--stone-edge);
        opacity: calc((var(--raised) - var(--c)) * 2.5);
        transition: opacity 240ms ease-out;
      }
      .raise-ground {
        width: 10.5rem;
        height: 1px;
        background: rgb(220 220 200 / 22%);
      }
      .loading-label {
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: rgb(220 220 200 / 55%);
      }
    </style>
  </head>
  <body class="is-loading">
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="crosshair"></div>
      <!--
        The pause stack, shown whenever the mouse is not captured: the controls
        panel, then the buttons the pause screen owns, mounted into
        #pause-buttons by their own modules. The hint is static markup because
        it has to be correct before any module has run.
      -->
      <div id="pause">
        <div id="capture-hint">
        <div class="hint-title">click to play</div>
        <dl class="controls">
          <dt>Look Around</dt>
          <dd>
            <!-- Drawn inline rather than loaded: no asset in this project is a
                 file, and a mouse is four strokes. -->
            <svg class="control-mouse" viewBox="0 0 24 20" aria-label="move the mouse">
              <rect x="8" y="2" width="8" height="16" rx="4" />
              <line x1="12" y1="5.5" x2="12" y2="8.5" />
              <path d="M4.5 6.5 q-1.6 3.5 0 7" />
              <path d="M19.5 6.5 q1.6 3.5 0 7" />
            </svg>
          </dd>

          <dt>Move Around</dt>
          <dd>
            <kbd class="key">W</kbd><kbd class="key">A</kbd><kbd class="key">S</kbd
            ><kbd class="key">D</kbd>
          </dd>

          <dt>Interact</dt>
          <dd><kbd class="key">E</kbd></dd>

          <dt>Sprint</dt>
          <dd><kbd class="key key-wide">Shift</kbd></dd>

          <dt>Crouch</dt>
          <dd><kbd class="key key-wide">Caps Lock</kbd></dd>

          <dt>Jump</dt>
          <dd><kbd class="key key-wide">Space</kbd></dd>
        </dl>
        </div>
        <div id="pause-buttons"></div>
      </div>
    </div>
    <!--
      The stone that goes up while the game loads. Static for the same reason
      the styles above are: it has to be on screen before any module has run.
      `ui/raise.ts` builds the same thing for the zone indicator and for the
      fallback path, and `--c` is the order the courses are laid in — not the
      order they are written in, which is bottom-up per pile.
    -->
    <div id="loading">
      <div class="raise" aria-hidden="true">
        <div class="raise-field">
          <div class="raise-pile" style="--pw: 1.5rem">
            <span class="raise-course" style="--c: 1; --w: 100%; --x: 0"></span>
            <span class="raise-course" style="--c: 4; --w: 86%; --x: 7%"></span>
          </div>
          <div class="raise-pile" style="--pw: 4.4rem">
            <span class="raise-course" style="--c: 0; --w: 96%; --x: 2%"></span>
            <span class="raise-course" style="--c: 2; --w: 92%; --x: 4%"></span>
            <span class="raise-course" style="--c: 3; --w: 90%; --x: 5%"></span>
            <span class="raise-course" style="--c: 5; --w: 86%; --x: 8%"></span>
            <span class="raise-course" style="--c: 7; --w: 82%; --x: 10%"></span>
            <span class="raise-course" style="--c: 8; --w: 76%; --x: 13%"></span>
            <span class="raise-course" style="--c: 9; --w: 70%; --x: 16%"></span>
            <span class="raise-course" style="--c: 10; --w: 60%; --x: 21%"></span>
          </div>
          <div class="raise-pile" style="--pw: 1.1rem">
            <span class="raise-course" style="--c: 6; --w: 100%; --x: 0"></span>
          </div>
          <div class="raise-glimmer"></div>
        </div>
        <div class="raise-ground"></div>
      </div>
      <div class="loading-label">starting</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
