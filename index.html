<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no stops double-tap zoom eating game taps.
         viewport-fit=cover fills the notch area on phones. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%230a0a0f'/%3E%3Crect x='2' y='12' width='12' height='1' fill='%2346413a'/%3E%3Crect x='5' y='3' width='4' height='9' fill='%23dcdcc8'/%3E%3Crect x='8' y='3' width='1' height='9' fill='%239a958a'/%3E%3Crect x='11' y='7' width='3' height='5' fill='%237f7a70'/%3E%3Crect x='13' y='7' width='1' height='5' fill='%235f5b53'/%3E%3C/svg%3E" />
    <meta name="description" content="Here Stands What Once Was" />
    <!-- The title run together, lowercase, no spaces. The description carries
         the real one, so search and link previews still say what this is. -->
    <title>herestandswhatoncewas</title>

    <!--
      Critical first-paint styles, inline on purpose.

      `styles.css` is imported from `main.ts`, so Vite serves it *through
      JavaScript* — which means there is a window, before that module has run,
      where the browser paints this document with its own default styles: a
      white page, black text, and the capture hint sitting in the corner. The
      flash is brief and extremely obvious, and nothing inside the app can fix
      it, because the app has not started yet.

      So everything the first frame needs is duplicated here: the dark ground
      colour, and the loading screen itself. The loading markup is static rather
      than built in script for the same reason — it has to exist before any
      script runs. `ui/Loader.ts` adopts these elements instead of creating its
      own, and `styles.css` restates these rules for the rest of the session.
      The transitions are not here: at `--lit: 0` this is the sky at half
      light with the stones already standing against it, which is the frame that
      wants to be up instantly.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0f;
        color: #dcdcc8;
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
      }
      /* Scoped to the class so it stops applying the moment boot removes it. An
         unscoped rule here would keep the hint hidden for the whole session. */
      .is-loading #capture-hint {
        opacity: 0;
      }
      /* Six flat levels rather than a smooth ramp, with the steps between them
         dithered at the three-pixel block the whole game is quantized to: two
         posterised gradients half a band apart, the upper one checkerboarded.
         In the middle of a band they agree and it is flat; at a step they
         disagree and half the pixels take the level above. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        overflow: hidden;
        background: #0a0a0f;
        --lit: 0;
        --land: #08080c;
        --cycle: 34s;
      }
      .sky {
        position: absolute;
        inset: 0 0 32% 0;
        overflow: hidden;
      }
      .sky-tier {
        position: absolute;
        inset: 0;
      }
      .sky-tier.is-dawn {
        --b0: #12131c;
        --b1: #191a24;
        --b2: #23212d;
        --b3: #302733;
        --b4: #452f2c;
        --b5: #5e4231;
      }
      .sky-tier.is-day {
        --b0: #24313f;
        --b1: #2c3a46;
        --b2: #36434c;
        --b3: #435049;
        --b4: #565c4b;
        --b5: #6d6c53;
        opacity: 0;
        animation: sky-day var(--cycle) linear infinite;
      }
      .tier-bands,
      .tier-dither {
        position: absolute;
        inset: 0;
      }
      .tier-bands {
        background: linear-gradient(
          to bottom,
          var(--b0) 0 16.667%,
          var(--b1) 0 33.333%,
          var(--b2) 0 50%,
          var(--b3) 0 66.667%,
          var(--b4) 0 83.333%,
          var(--b5) 0 100%
        );
      }
      .tier-dither {
        background: linear-gradient(
          to bottom,
          var(--b0) 0 8.333%,
          var(--b1) 0 25%,
          var(--b2) 0 41.667%,
          var(--b3) 0 58.333%,
          var(--b4) 0 75%,
          var(--b5) 0 100%
        );
        mask-image: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%);
        mask-size: 6px 6px;
      }
      .sky-veil {
        position: absolute;
        inset: 0;
        background: #0a0a0f;
        opacity: 0.42;
        animation: sky-veil var(--cycle) linear infinite;
      }
      .wheel {
        position: absolute;
        left: 50%;
        top: 100%;
        width: 0;
        height: 0;
        animation: sky-wheel var(--cycle) linear infinite;
      }
      @keyframes sky-wheel {
        from {
          transform: rotate(-80deg);
        }
        to {
          transform: rotate(280deg);
        }
      }
      .orb {
        position: absolute;
        left: 0;
        top: 0;
      }
      .orb.is-sun {
        width: 15vh;
        height: 15vh;
        margin: -7.5vh;
        transform: translateY(-46vh);
        background: radial-gradient(
          circle,
          #f4e6bd 0 25%,
          #d9b478 0 32%,
          #9a6f45 0 40%,
          #5d4430 0 49%,
          transparent 0 100%
        );
      }
      .orb.is-moon {
        width: 9vh;
        height: 9vh;
        margin: -4.5vh;
        transform: translateY(46vh);
        background: radial-gradient(
          circle,
          #dcdcc8 0 30%,
          #9a958a 0 38%,
          #46413a 0 46%,
          transparent 0 100%
        );
      }
      @keyframes sky-day {
        0% {
          opacity: 0.14;
        }
        22% {
          opacity: 1;
        }
        47% {
          opacity: 0.12;
        }
        58%,
        92% {
          opacity: 0;
        }
        100% {
          opacity: 0.14;
        }
      }
      @keyframes sky-veil {
        0% {
          opacity: 0.42;
        }
        22% {
          opacity: 0;
        }
        47% {
          opacity: 0.4;
        }
        72% {
          opacity: 0.82;
        }
        100% {
          opacity: 0.42;
        }
      }
      .horizon {
        position: absolute;
        left: 0;
        right: 0;
        top: 68%;
        height: 2px;
        background: rgb(220 220 200 / 13%);
      }
      .horizon-fill {
        position: absolute;
        inset: 0;
        background: rgb(220 220 200 / 62%);
        transform-origin: left center;
        transform: scaleX(var(--lit));
      }
      .horizon-cap {
        position: absolute;
        left: 0;
        top: -3px;
        width: 3px;
        height: 8px;
        background: #dcdcc8;
        transform: translateX(calc(var(--lit) * (100vw - 3px)));
      }
      .land {
        position: absolute;
        inset: 68% 0 0 0;
        background: var(--land);
      }
      .boot-caption {
        position: absolute;
        left: clamp(1.5rem, 6vw, 5rem);
        bottom: clamp(2rem, 10vh, 5.5rem);
        display: grid;
        justify-items: start;
        gap: 0.8rem;
      }
      .boot-title {
        font-size: 0.94rem;
        letter-spacing: 0.34em;
        text-transform: lowercase;
        color: rgb(220 220 200 / 82%);
      }
      .loading-label {
        font-size: 0.68rem;
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: rgb(220 220 200 / 48%);
      }
    </style>
  </head>
  <body class="is-loading">
    <canvas id="viewport"></canvas>
    <div id="overlay">
      <div id="crosshair"></div>
      <!--
        The pause stack, shown whenever the mouse is not captured: the controls
        panel, then the buttons the pause screen owns, mounted into
        #pause-buttons by their own modules. The hint is static markup because
        it has to be correct before any module has run.
      -->
      <div id="pause">
        <div id="capture-hint">
        <div class="hint-title">click to play</div>
        <dl class="controls">
          <dt>Look Around</dt>
          <dd>
            <!-- Drawn inline rather than loaded: no asset in this project is a
                 file, and a mouse is four strokes. -->
            <svg class="control-mouse" viewBox="0 0 24 20" aria-label="move the mouse">
              <rect x="8" y="2" width="8" height="16" rx="4" />
              <line x1="12" y1="5.5" x2="12" y2="8.5" />
              <path d="M4.5 6.5 q-1.6 3.5 0 7" />
              <path d="M19.5 6.5 q1.6 3.5 0 7" />
            </svg>
          </dd>

          <dt>Move Around</dt>
          <dd>
            <kbd class="key">W</kbd><kbd class="key">A</kbd><kbd class="key">S</kbd
            ><kbd class="key">D</kbd>
          </dd>

          <dt>Interact</dt>
          <dd><kbd class="key">E</kbd></dd>

          <dt>Sprint</dt>
          <dd><kbd class="key key-wide">Shift</kbd></dd>

          <dt>Crouch</dt>
          <dd><kbd class="key key-wide">Caps Lock</kbd></dd>

          <dt>Jump</dt>
          <dd><kbd class="key key-wide">Space</kbd></dd>
        </dl>
        </div>
        <div id="pause-buttons"></div>
      </div>
    </div>
    <!--
      The loading screen: a dithered sky with the sun and the moon turning on one
      wheel about the middle of the horizon, and the horizon itself as the bar.
      Static for the same reason the styles above are — it has to be on screen
      before any module has run. `ui/LoadingScreen.ts` builds the same thing for
      a page that has none, and drives `--lit` for every wait in the game.
    -->
    <div id="loading">
      <div class="sky" aria-hidden="true">
        <div class="sky-tier is-dawn">
          <div class="tier-bands"></div>
          <div class="tier-dither"></div>
        </div>
        <div class="sky-tier is-day">
          <div class="tier-bands"></div>
          <div class="tier-dither"></div>
        </div>
        <div class="sky-veil"></div>
        <div class="wheel">
          <div class="orb is-sun"></div>
          <div class="orb is-moon"></div>
        </div>
      </div>
      <div class="horizon" aria-hidden="true">
        <div class="horizon-fill"></div>
        <div class="horizon-cap"></div>
      </div>
      <div class="land" aria-hidden="true"></div>
      <div class="boot-caption">
        <div class="boot-title">here stands what once was</div>
        <div class="loading-label">starting</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
